<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting TikTok…</title>
<meta name="description" content="Returning to Promo Agent.">
<link rel="canonical" href="https://vlad1710.github.io/oauth/tiktok/">
<meta property="og:title" content="Connecting TikTok…">
<meta property="og:description" content="Returning to Promo Agent.">
<meta property="og:url" content="https://vlad1710.github.io/oauth/tiktok/">
<link rel="stylesheet" href="/site.css">

</head>
<body><div class="page legal"><h1>TikTok</h1><div id="box"></div>
      <script>
        const q = new URLSearchParams(location.search), code = q.get("code"), app = q.get("state") || "";
        const box = document.getElementById("box");
        if (!code) box.innerHTML = "<p>TikTok did not return a code: " + (q.get("error_description") || q.get("error") || "unknown error") + "</p>";
        else if (!/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) location.replace("http://localhost:4321/oauth/tiktok" + location.search);
        else {
          const text = app + " " + code;
          box.innerHTML = "<p>Скопіюй цей рядок і встав у промо-агенті: Підключення → TikTok → «Вставити код».</p>" +
            "<p style='word-break:break-all;font:16px monospace;background:#222;padding:12px;border-radius:10px' id='c'></p>" +
            "<p><button class='store' id='copy'>Скопіювати</button></p><p style='color:#a9abbd'>Код діє кілька хвилин.</p>";
          document.getElementById("c").textContent = text;
          document.getElementById("copy").onclick = () => navigator.clipboard.writeText(text).then(() => document.getElementById("copy").textContent = "Скопійовано ✓");
        }
      </script></div><script>(function(){var q=new URLSearchParams(location.search),s=q.get("utm_source");if(!s)return;
var m=q.get("utm_medium")||"social",c=q.get("utm_campaign")||"bio";
document.querySelectorAll('a[href*="play.google.com"],a[href*="apps.apple.com"]').forEach(function(a){var u=new URL(a.href);
if(u.hostname.indexOf("play.")===0)u.searchParams.set("referrer","utm_source="+s+"&utm_medium="+m+"&utm_campaign="+c);
else u.searchParams.set("ct",(s+"-"+m+"-"+c).slice(0,40));a.href=u.toString();});})();</script></body>
</html>
